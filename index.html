<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Agent Office</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a slim studio header over a full-bleed isometric office; feed, debug tools and sheets float above it. Single dark theme by choice. */
:root{
  color-scheme: dark;
  --bg:#0f172a;
  --stage:#131a2e;
  --card:rgba(30,39,66,.92);
  --line:#2a3555;
  --ink:#eef1f8;
  --muted:#95a0bd;
  --accent:#6366f1;
  --ok:#34d399;
  --warn:#f59e0b;
  --font:"Inter","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.35;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

header{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px;display:none}
nav{display:flex;align-items:center;gap:4px;flex:none}
#pause{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-weight:500}
#pause svg{display:block}
#pause span{display:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.tab{position:relative;background:transparent;border:0;border-radius:8px;padding:7px 9px;color:#c5cce0;font-weight:500}
.tab:hover,.tab[aria-expanded="true"]{color:#fff;background:rgba(255,255,255,.06)}
.badge{position:absolute;top:-3px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#201400;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--stage)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;will-change:transform;transition:opacity .25s}
.pin.dim{opacity:.32}
.tag{display:flex;flex-direction:column;align-items:center;gap:5px}
.bubble{background:#fff;color:#1b2136;font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:999px;white-space:nowrap;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.bubble[hidden]{display:none}
.card{pointer-events:auto;display:flex;align-items:center;gap:8px;text-align:left;background:rgba(40,48,74,.9);border:1px solid transparent;border-radius:9px;padding:4px 10px 5px 8px;white-space:nowrap}
.card i{width:9px;height:9px;border-radius:50%;background:#9aa3b8;flex:none}
.card[data-s="work"] i{background:var(--ok)}
.card[data-s="move"] i{background:var(--warn)}
.card b{display:block;font-size:12px;font-weight:600;line-height:1.2}
.card small{display:block;font-size:10.5px;color:#c3cadd;line-height:1.2}
.card.sel{border-color:#fff}
.compact .card small{display:none}
.compact .card{padding:3px 8px 3px 6px}
.compact .bubble{font-size:10.5px;padding:3px 8px}
.dept{pointer-events:auto;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.93);color:#1b2136;border:0;border-radius:999px;padding:5px 12px 5px 9px;font-weight:600;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.dept i{width:9px;height:9px;border-radius:50%;background:var(--c)}

#focusbar{position:absolute;left:12px;top:12px;display:none;gap:8px;z-index:3}
#focusbar.on{display:flex}
#focusbar button{border-radius:10px;padding:8px 14px;font-weight:600;border:1px solid var(--line);background:var(--card)}
#focusbar #focusName{background:var(--accent);border-color:var(--accent);color:#fff}

#debug{position:absolute;left:12px;top:12px;z-index:2;display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-family:var(--mono)}
#focusbar.on ~ #debug{top:60px}
#stats{background:rgba(3,6,14,.86);color:#5fe3a1;border:0;border-radius:8px;padding:7px 10px;font:11.5px/1.45 var(--mono);text-align:left;white-space:pre}
#ctl{background:rgba(3,6,14,.86);border-radius:10px;padding:10px;width:204px}
#ctl[hidden]{display:none}
#ctl p{margin:0 0 8px;color:#5fe3a1;font-size:12px}
#ctl .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#ctl button{background:#12352a;color:#d9ffe9;border:0;border-radius:6px;padding:8px 4px;font:12px var(--mono)}
#ctl button:disabled{opacity:.38;cursor:default}
#ctl #wander{grid-column:1/-1}
#ctl #wander[aria-pressed="true"]{background:#1f7a55}

#feed{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);display:flex;flex-direction:column;max-height:152px}
#feed h2{margin:0}
#feedToggle{width:100%;display:flex;align-items:center;gap:9px;padding:9px 14px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;font-size:11.5px;font-weight:600;letter-spacing:.09em;color:#c5cce0;text-align:left}
#feedToggle:hover{background:rgba(255,255,255,.04)}
#feedToggle::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
#feedToggle .live{margin-left:auto;font-weight:400;letter-spacing:0;color:var(--muted);font-size:12px}
#feedToggle .new{display:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:0;place-items:center}
#feedToggle svg{flex:none;color:var(--muted);transition:transform .2s}
#feed.collapsed #feedToggle{border-bottom-color:transparent;border-radius:14px}
#feed.collapsed #feedToggle svg{transform:rotate(-90deg)}
#feed.collapsed #feedToggle .new.on{display:grid}
#feed.collapsed ul{display:none}
#feed ul{list-style:none;margin:0;padding:0;overflow-y:auto;touch-action:pan-y;min-height:0}
#feed li{display:flex;align-items:center;gap:9px;padding:6px 14px;border-bottom:1px solid rgba(42,53,85,.6)}
#feed li:last-child{border-bottom:0}
#feed li i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--d,#7c88a8)}
#feed li p{margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
#feed time{flex:none;color:var(--muted);font-size:11.5px}
.av{flex:none;width:24px;height:24px;border-radius:50%;display:block}

#sheet{position:absolute;z-index:5;left:0;right:0;bottom:0;max-height:76%;background:#141c33;border-top:1px solid var(--line);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.45)}
#sheet[hidden]{display:none}
#sheet .top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
#sheet h2{margin:0;font-size:16px;font-weight:700}
#sheet .x{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
#sheetBody{overflow-y:auto;padding:0 16px 18px;touch-action:pan-y}
#sheetBody h3{margin:14px 0 6px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:9px 11px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.row p{margin:0;flex:1;min-width:0}
.row p small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.pill{flex:none;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:#c5cce0}
.pill.go{background:rgba(52,211,153,.15);border-color:var(--ok);color:var(--ok)}
.row button{flex:none;border-radius:8px;padding:6px 10px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:12.5px}
.row button.yes{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{color:var(--muted);padding:6px 2px}
#fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}

@media (min-width:820px){
  header{padding:12px 24px}
  .brand h1{font-size:20px}
  .brand p{display:block}
  #pause span{display:inline}
  .tab{padding:8px 12px;font-size:15px}
  #feed{left:20px;right:auto;top:20px;bottom:auto;width:430px;max-height:300px}
  #debug{left:auto;right:20px;top:20px;align-items:flex-end}
  #focusbar{left:470px;top:20px}
  #focusbar.on ~ #debug{top:20px}
  #sheet{left:auto;top:0;bottom:0;width:400px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>Brightframe Studio</h1>
      <p>A content creation company run by AI agents</p>
    </div>
    <nav aria-label="Studio">
      <button id="pause" type="button" aria-pressed="false" aria-label="Pause simulation">
        <svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><path id="pauseIcon" fill="currentColor" d="M1 0h3.4v14H1zM7.6 0H11v14H7.6z"/></svg><span>Pause</span>
      </button>
      <span class="sep"></span>
      <button class="tab" type="button" data-tab="tasks" aria-expanded="false">Tasks</button>
      <button class="tab" type="button" data-tab="brain" aria-expanded="false">Brain</button>
      <button class="tab" type="button" data-tab="inbox" aria-expanded="false">Inbox<span class="badge" id="inboxN">3</span></button>
    </nav>
  </header>
  <section id="stage" aria-label="Isometric view of the studio">
    <div id="labels"></div>
    <div id="focusbar"><button type="button" id="back">‹ Back to office</button><button type="button" id="focusName">Executive</button></div>
    <div id="debug">
      <button id="stats" type="button" title="Show or hide agent controls">60 fps</button>
      <div id="ctl">
        <p id="ctlTitle">Select an agent</p>
        <div class="grid">
          <button type="button" data-cmd="coffee" disabled>Coffee</button>
          <button type="button" data-cmd="meeting" disabled>Meeting</button>
          <button type="button" data-cmd="visit" disabled>Visit</button>
          <button type="button" data-cmd="desk" disabled>Back to desk</button>
          <button type="button" id="wander" aria-pressed="false">Wander: off</button>
        </div>
      </div>
    </div>
    <div id="feed"><h2><button type="button" id="feedToggle" aria-expanded="true" aria-controls="feedList" title="Collapse or expand the activity feed">ACTIVITY<span class="new" id="feedNew" aria-label="new events">0</span><span class="live">live</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h2><ul id="feedList"></ul></div>
    <div id="sheet" hidden><div class="top"><h2 id="sheetTitle">Tasks</h2><button class="x" type="button" id="sheetClose">Close</button></div><div id="sheetBody"></div></div>
    <div id="fail">This view needs WebGL, which this browser has switched off.</div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var T=window.THREE, PI=Math.PI, $=function(id){return document.getElementById(id);};
var stage=$('stage');
if(!T){ $('fail').style.display='flex'; $('fail').textContent='The 3D library did not load. Check the connection and reload.'; return; }

/* ================= Configuration: rooms and agents ================= */
var ROOMS={
  exec:{name:'Executive', color:'#6366f1', label:[-2.2,3.2,-6.4], x0:-10,z0:-10, door:[-2.2,-2.2], floor:'#d6d4e8', wall:0xa9aacb},
  prod:{name:'Production',color:'#f97316', label:[-8.6,3.0,9.4], x0:-10,z0:0,   door:[-2.2,2.2],  floor:'#e6dcdf', wall:0xb6a4ab},
  cont:{name:'Content',   color:'#ec4899', label:[6.0,3.4,-9.2], x0:0,  z0:-10, door:[2.2,-2.2],  floor:'#e8d8e0', wall:0xc0a5b2},
  fin: {name:'Finance',   color:'#14b8a6', label:[3.4,2.0,8.4], x0:0,  z0:0,   door:[2.2,2.2],   floor:'#d4dfda', wall:0xa0b2ab}
};
var RING=['exec','cont','fin','prod'];
var AGENTS=[
  {id:'avery', name:'Avery', role:'Chief of Staff',  room:'exec', color:'#2f3fd6', skin:'#8a5a3c', hair:'#1b1512',
   desk:[-5.5,-4.6], exit:1.3,  workVia:[[-4.2,-6.8]], work:[-7.5,-7.3], face:PI,    act:'write',   doorVia:[], visit:[-5.5,-3.4,PI]},
  {id:'jordan',name:'Jordan',role:'Video Producer',  room:'prod', color:'#f2622e', skin:'#7a4a30', hair:'#17120f',
   desk:[-7,3.2],    exit:1.3,  workVia:[[-5.7,4.5]],  work:[-8.1,6],    face:-PI/2, act:'present', doorVia:[], visit:[-7,4.6,PI]},
  {id:'casey', name:'Casey', role:'Dubber',          room:'prod', color:'#e8912a', skin:'#e0a77e', hair:'#7a3b22',
   desk:[-4.2,6.6],  exit:1.3,  workVia:[[-2.9,7.9]],  work:[-6.4,8.2],  face:-PI/2, act:'mic',     doorVia:[], visit:[-2.7,6.6,-PI/2]},
  {id:'sam',   name:'Sam',   role:'Script Writer',   room:'cont', color:'#e0559a', skin:'#e8b48c', hair:'#6a3a22',
   desk:[6.8,-3.4],  exit:-1.3, workVia:[[5.5,-5.6]],  work:[8,-7.6],    face:PI,    act:'write',   doorVia:[], visit:[6.8,-2.2,PI]},
  {id:'riley', name:'Riley', role:'Content Creator', room:'cont', color:'#a855f7', skin:'#c98f66', hair:'#2a1d16',
   desk:[3.4,-7.2],  exit:1.3,  workVia:[[4.9,-6.2]],  work:[2.75,-5.2], face:-PI/2, act:'film',    doorVia:[[4.9,-6.2]], visit:[3.4,-6.0,PI]},
  {id:'morgan',name:'Morgan',role:'Finance Officer', room:'fin',  color:'#149e8e', skin:'#f0c9a4', hair:'#3a2a1e',
   desk:[5.5,5.2],   exit:-1.3, workVia:[],            work:[1.55,6.5],  face:-PI/2, act:'browse',  doorVia:[], visit:[3.9,5.2,PI/2]}
];
var VIDEOS=['Cheap Eats in Lisbon','Budget Meal Prep in 20 Minutes','Hidden Food Markets of Porto','Five Pantry Dinners Under $5','Street Food Night in Bangkok','One-Pan Weeknight Pasta'];
var STAGES=[
  {who:'avery', title:function(v){return 'Plan video: “'+v+'”';},    bubble:'Planning the video…',        carry:'Bringing brief to Sam…',     msg:'Brief is ready, over to you for the script'},
  {who:'sam',   title:function(v){return 'Write script: “'+v+'”';},  bubble:'Writing the script…',        msg:'Script is locked, ready to shoot'},
  {who:'riley', title:function(v){return 'Shoot footage: “'+v+'”';}, bubble:'Shooting B-roll…',           carry:'Bringing footage to Jordan…', msg:'Footage is in, ready for the edit'},
  {who:'jordan',title:function(){return 'Cut a 30-second short';},   bubble:'Cutting a 30-second short…', msg:'Short is cut, over to you for the dub'},
  {who:'casey', title:function(){return 'Fix subtitle timing';},     bubble:'Fixing subtitle timing…',    msg:'Final cut is out, please log the costs'},
  {who:'morgan',title:function(v){return 'Log costs: “'+v+'”';},     bubble:'Logging production costs…'}
];
function byId(id){ for(var i=0;i<AGENTS.length;i++) if(AGENTS[i].id===id) return AGENTS[i]; return null; }
function rnd(a,b){ return a+Math.random()*(b-a); }

/* ================= Renderer and isometric camera ================= */
var renderer;
try{ renderer=new T.WebGLRenderer({antialias:true}); }catch(e){ $('fail').style.display='flex'; return; }
var DPR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
renderer.outputEncoding=T.sRGBEncoding;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.setClearColor(0x131a2e,1);
stage.insertBefore(renderer.domElement,stage.firstChild);
var canvas=renderer.domElement;

var scene=new T.Scene();
var camera=new T.OrthographicCamera(-10,10,10,-10,1,220);
var CAM=new T.Vector3(48,41,48), SIN_ELEV=41/Math.sqrt(48*48*2+41*41);
var view={x:0,z:0,zoom:1}, goal={x:0,z:0,zoom:1}, home={x:0,z:0}, baseH=10, aspect=1, focus=null;
function resize(){
  var w=stage.clientWidth||1, h=stage.clientHeight||1;
  renderer.setSize(w,h,false); aspect=w/h;
  baseH=Math.max(11.4,16.6/aspect);
  var wide=w>=820;
  home=wide?{x:-2.2,z:2.2}:{x:1.0,z:1.0};
  if(!focus){ goal.x=home.x; goal.z=home.z; }
  $('labels').classList.toggle('compact',w<600);
}
function applyCamera(){
  var hh=baseH/view.zoom;
  camera.left=-hh*aspect; camera.right=hh*aspect; camera.top=hh; camera.bottom=-hh;
  camera.position.set(view.x+CAM.x,CAM.y,view.z+CAM.z); camera.lookAt(view.x,0,view.z);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage);

/* ================= Lighting and reflections ================= */
renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
renderer.shadowMap.type=T.PCFSoftShadowMap;
(function(){
  /* a soft studio "room" baked into an environment map, so glossy floors, screens and leather pick up reflections */
  var env=new T.Scene(), geo=new T.BoxGeometry(1,1,1);
  var shell=new T.Mesh(geo,new T.MeshBasicMaterial({color:0x6f7684,side:T.BackSide})); shell.scale.set(40,16,40); shell.position.y=7; env.add(shell);
  function lamp(c,k,x,y,z,sx,sy,sz){ var m=new T.Mesh(geo,new T.MeshBasicMaterial({color:new T.Color(c).multiplyScalar(k)})); m.position.set(x,y,z); m.scale.set(sx,sy,sz); env.add(m); }
  lamp(0xffffff,3.2,0,14.8,0,22,0.2,22);
  lamp(0xfff0dc,3.6,-19.8,6,0,0.2,7,26);
  lamp(0xdce7ff,2.6,0,6,-19.8,26,7,0.2);
  lamp(0xffffff,1.2,19.8,5,6,0.2,4,10);
  lamp(0x2a2622,1,0,-0.9,0,40,0.2,40);
  var pm=new T.PMREMGenerator(renderer); scene.environment=pm.fromScene(env,0.035).texture; pm.dispose();
})();
scene.add(new T.HemisphereLight(0xeef2ff,0x5a4a40,0.3));
var sun=new T.DirectionalLight(0xfff1de,1.4);
sun.position.set(-7,24,-5); sun.castShadow=true; sun.shadow.mapSize.set(4096,4096);
sun.shadow.camera.left=-16; sun.shadow.camera.right=16; sun.shadow.camera.top=16; sun.shadow.camera.bottom=-16;
sun.shadow.camera.near=1; sun.shadow.camera.far=70; sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02; sun.shadow.radius=3;
scene.add(sun);
var fill=new T.DirectionalLight(0xdfe6ff,0.38); fill.position.set(22,14,20); scene.add(fill);

/* ================= Mesh helpers ================= */
var mats={};
function mat(c,opt){ var k=c+JSON.stringify(opt||0); if(!mats[k]){ var o={color:new T.Color(c).convertSRGBToLinear(),roughness:0.72,metalness:0}; if(opt) for(var p in opt) o[p]=(p==='emissive')?new T.Color(opt[p]).convertSRGBToLinear():opt[p]; mats[k]=new T.MeshStandardMaterial(o);} return mats[k]; }
function sh(m){ m.castShadow=true; m.receiveShadow=true; return m; }
function box(w,h,d,m,x,y,z,parent,flat){ var b=new T.Mesh(new T.BoxGeometry(w,h,d),m); b.position.set(x,y,z); if(!flat){ b.castShadow=true; b.receiveShadow=true; } (parent||scene).add(b); return b; }
function cyl(rt,rb,h,m,x,y,z,parent,seg){ var c=new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||16),m); c.position.set(x,y,z); c.castShadow=true; c.receiveShadow=true; (parent||scene).add(c); return c; }
function ball(r,m,x,y,z,parent){ var s=new T.Mesh(new T.SphereGeometry(r,16,12),m); s.position.set(x,y,z); s.castShadow=true; (parent||scene).add(s); return s; }

  if(feedCollapsed){ feedUnread++; var nb=$('feedNew'); nb.textContent=feedUnread>99?'99+':feedUnread; nb.classList.add('on'); }
  while(feed.length>40){ feedEl.removeChild(feed.pop().li); }
}
setInterval(function(){ feed.forEach(function(f){ f.li.lastChild.textContent=ago(f.at); }); },10000);

/* ================= Sheets: Tasks, Brain, Inbox ================= */
var sheet=$('sheet'), sheetBody=$('sheetBody'), openTab=null, tabs=document.querySelectorAll('.tab');
function showSheet(tab){ openTab=tab; sheet.hidden=!tab; for(var i=0;i<tabs.length;i++) tabs[i].setAttribute('aria-expanded',tabs[i].dataset.tab===tab?'true':'false'); refreshSheet(); }
for(var ti=0;ti<tabs.length;ti++) (function(b){ b.addEventListener('click',function(){ showSheet(openTab===b.dataset.tab?null:b.dataset.tab); }); })(tabs[ti]);
$('sheetClose').addEventListener('click',function(){ showSheet(null); });
function refreshSheet(){
  $('inboxN').textContent=inbox.length; $('inboxN').style.display=inbox.length?'grid':'none';
  if(!openTab) return; var h='';
  if(openTab==='tasks'){ $('sheetTitle').textContent='Tasks';
    [['In Progress','go'],['Queued',''],['Done','']].forEach(function(grp){
      var list=tasks.filter(function(t){ return t.status===grp[0]; }).reverse().slice(0,grp[0]==='Done'?8:20);
      h+='<h3>'+grp[0]+' · '+list.length+'</h3>'; if(!list.length) h+='<p class="empty">Nothing here right now.</p>';
      list.forEach(function(t){ var a=byId(t.who); h+='<div class="row">'+avatar(a)+'<p>'+esc(t.title)+'<small>'+a.name+' · '+a.role+'</small></p><span class="pill '+grp[1]+'">'+grp[0]+'</span></div>'; }); });
  } else if(openTab==='brain'){ $('sheetTitle').textContent='Brain'; h='<h3>Shared studio memory</h3>';
    brain.slice(0,14).forEach(function(n){ h+='<div class="row"><p>'+esc(n.t)+'<small>'+esc(n.d)+'</small></p></div>'; });
  } else { $('sheetTitle').textContent='Inbox'; h='<h3>Waiting for your decision · '+inbox.length+'</h3>'; if(!inbox.length) h+='<p class="empty">You are all caught up.</p>';
    inbox.forEach(function(m,i){ var a=byId(m.from); h+='<div class="row">'+avatar(a)+'<p>'+esc(m.t)+'<small>'+a.name+' · '+esc(m.d)+'</small></p><button type="button" class="yes" data-i="'+i+'" data-ok="1">Approve</button><button type="button" data-i="'+i+'">Dismiss</button></div>'; }); }
  sheetBody.innerHTML=h;
}
sheetBody.addEventListener('click',function(e){ var b=e.target.closest('button[data-i]'); if(!b) return;
  var m=inbox.splice(+b.dataset.i,1)[0]; log(byId(m.from),'msg','You '+(b.dataset.ok?'approved':'dismissed')+': '+m.t); refreshSheet(); });

/* ================= Debug tools, pause, focus ================= */
var selected=null, wander=false, wanderT=2, debugOn=true, cmdBtns=document.querySelectorAll('#ctl [data-cmd]');
function select(a){ if(selected) selected.card.classList.remove('sel'); selected=a; if(a) a.card.classList.add('sel');
  $('ctlTitle').textContent=a?a.name+' · '+a.role:'Select an agent'; for(var i=0;i<cmdBtns.length;i++) cmdBtns[i].disabled=!a; if(a) $('ctl').hidden=false; }
for(var ci=0;ci<cmdBtns.length;ci++) (function(b){ b.addEventListener('click',function(){ if(selected) command(selected,b.dataset.cmd); }); })(cmdBtns[ci]);
$('wander').addEventListener('click',function(){ wander=!wander; this.setAttribute('aria-pressed',wander); this.textContent='Wander: '+(wander?'on':'off'); });
$('stats').addEventListener('click',function(){ $('ctl').hidden=!$('ctl').hidden; });
$('pause').addEventListener('click',function(){ paused=!paused; this.setAttribute('aria-pressed',paused); this.setAttribute('aria-label',paused?'Resume simulation':'Pause simulation');
  this.querySelector('span').textContent=paused?'Resume':'Pause'; $('pauseIcon').setAttribute('d',paused?'M1 0l10 7-10 7z':'M1 0h3.4v14H1zM7.6 0H11v14H7.6z'); });
function setFocus(k){ focus=k; $('focusbar').classList.toggle('on',!!k);
  if(k){ var r=ROOMS[k]; $('focusName').textContent=r.name; $('focusName').style.background=r.color; $('focusName').style.borderColor=r.color;
    goal.x=r.cx; goal.z=r.cz; goal.zoom=Math.min(3,Math.max(1.3,baseH*aspect/8.6)); }
  else { goal.x=home.x; goal.z=home.z; goal.zoom=1; }
  AGENTS.forEach(function(a){ a.pin.classList.toggle('dim',!!k&&a.room!==k); });
  Object.keys(ROOMS).forEach(function(n){ ROOMS[n].pin.classList.toggle('dim',!!k&&n!==k); }); }
$('back').addEventListener('click',function(){ setFocus(null); });
$('focusName').addEventListener('click',function(){ if(focus) setFocus(focus); });

/* pan and zoom */
var ptrs={}, pinch=0;
canvas.addEventListener('pointerdown',function(e){ ptrs[e.pointerId]={x:e.clientX,y:e.clientY}; try{ canvas.setPointerCapture(e.pointerId); }catch(_){} });
canvas.addEventListener('pointermove',function(e){ var p=ptrs[e.pointerId]; if(!p) return; var ids=Object.keys(ptrs);
  if(ids.length===1){ var u=2*(baseH/view.zoom)/(stage.clientHeight||1), dx=(e.clientX-p.x)*u*0.7071, dy=(e.clientY-p.y)*u*0.7071/SIN_ELEV;
    goal.x=Math.max(-14,Math.min(14,goal.x-dx-dy)); goal.z=Math.max(-14,Math.min(14,goal.z+dx-dy)); view.x=goal.x; view.z=goal.z; }
  p.x=e.clientX; p.y=e.clientY;
  if(ids.length===2){ var a=ptrs[ids[0]], b=ptrs[ids[1]], d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch){ goal.zoom=Math.max(0.6,Math.min(4,goal.zoom*d/pinch)); view.zoom=goal.zoom; } pinch=d; } });
function up(e){ delete ptrs[e.pointerId]; pinch=0; }
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',function(e){ e.preventDefault(); goal.zoom=Math.max(0.6,Math.min(4,goal.zoom*(1-e.deltaY*0.0012))); },{passive:false});
window.addEventListener('keydown',function(e){ if(e.key==='d'&&!e.metaKey&&!e.ctrlKey){ debugOn=!debugOn; $('debug').style.display=debugOn?'flex':'none'; } });

/* ================= Labels ================= */
var v3=new T.Vector3();
function place(pin,x,y,z,w,h){ v3.set(x,y,z).project(camera); pin.style.transform='translate('+((v3.x*0.5+0.5)*w).toFixed(1)+'px,'+((-v3.y*0.5+0.5)*h).toFixed(1)+'px) translate(-50%,-100%)'; }
function placeLabels(){ var w=stage.clientWidth, h=stage.clientHeight;
  AGENTS.forEach(function(a){ place(a.pin,a.x,a.pose.hipY+1.2,a.z,w,h); });
  Object.keys(ROOMS).forEach(function(k){ var r=ROOMS[k]; place(r.pin,r.label[0],r.label[1],r.label[2],w,h); }); }

/* ================= Boot: open mid-shift ================= */
function seedWorking(id,video,stage){
  var a=byId(id), s=STAGES[stage], t={id:++taskSeq,video:video,stage:stage,who:id,title:s.title(video),status:'In Progress'}; tasks.push(t); liveVideos++;
  a.job={kind:'work',task:t,route:workRoute(a),act:a.act,face:a.face,dur:rnd(6,11),bubble:s.bubble,arrived:true,onDone:function(){ finishTask(a,t); }};
  a.route=a.job.route; a.ti=a.route.length-1; a.dir=1; a.state='acting'; a.x=a.work[0]; a.z=a.work[1]; a.h=a.face; standPose(a.pose); setLine(a);
  log(a,'ok',t.title+' → In Progress'); log(a,'',a.name+' started '+t.title);
}
videoSeq=2;
seedWorking('jordan',VIDEOS[1],3);
seedWorking('avery',VIDEOS[0],0);
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) $('pause').click();
resize(); view.x=goal.x; view.z=goal.z; applyCamera(); drawTimeline(true,0); refreshSheet();

var last=performance.now(), frames=0, statT=0;
function frame(t){
  var real=Math.min(0.05,(t-last)/1000); last=t; var dt=paused?0:real; now+=dt;
  if(!paused){ director(dt); for(var i=0;i<AGENTS.length;i++) update(AGENTS[i],dt); stationFx(dt); }
  for(var n=0;n<AGENTS.length;n++) paint(AGENTS[n],real);
  var k=Math.min(1,real*5); view.x+=(goal.x-view.x)*k; view.z+=(goal.z-view.z)*k; view.zoom+=(goal.zoom-view.zoom)*k; applyCamera();
  Object.keys(dimMats).forEach(function(r){ var m=dimMats[r]; m.opacity+=((focus&&focus!==r?0.6:0)-m.opacity)*k; });
  renderer.render(scene,camera); placeLabels();
  frames++; statT+=real;
  if(statT>=0.5){ var inf=renderer.info.render; $('stats').textContent=Math.round(frames/statT)+' fps\n'+(+inf.calls)+' draw calls\n'+((+inf.triangles)/1000).toFixed(1)+'k tris\ndpr '+DPR.toFixed(2); frames=0; statT=0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* Hook for real agents. Example:
   AgentOffice.simulate(false);
   AgentOffice.startTask('jordan','Render the launch teaser');   // stands up and works until completed
   AgentOffice.completeTask('jordan');                           // walks back, sits, standby */
window.AgentOffice={
  agents:AGENTS, tasks:tasks,
  simulate:function(on){ simulate=!!on; },
  startTask:function(id,title){ var a=byId(id); if(a) createTask(null,-1,{who:id,title:title||'Working'}); },
  completeTask:function(id){ var a=byId(id); if(a&&a.job&&a.job.kind==='work'&&!a.job.over) release(a); },
  command:function(id,cmd){ var a=byId(id); if(a) command(a,cmd); }
};
})();
